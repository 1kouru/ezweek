<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>Edit Schedule</title>

    <link
        rel="stylesheet"
        href="editor.css"
    >
</head>

<body>

<header class="editor-header">

    <a
        href="index.html"
        class="back"
        aria-label="Назад"
    >
        ‹
    </a>

    <div class="header-info">
        <div class="editor-title">
            EDIT SCHEDULE
        </div>

        <div
            class="editor-subtitle"
            id="saveStatus"
        >
            READY
        </div>
    </div>

    <button
        id="saveButton"
        class="save-button"
        type="button"
    >
        SAVE
    </button>

</header>


<main class="editor">

    <!-- DAYS -->

    <nav class="day-tabs" id="dayTabs">

        <button data-day="MONDAY" type="button">MON</button>
        <button data-day="TUESDAY" type="button">TUE</button>
        <button data-day="WEDNESDAY" type="button">WED</button>
        <button data-day="THURSDAY" type="button">THU</button>
        <button data-day="FRIDAY" type="button">FRI</button>
        <button data-day="SATURDAY" type="button">SAT</button>
        <button data-day="SUNDAY" type="button">SUN</button>

    </nav>


    <!-- MAIN TOOLS -->

    <section class="top-tools">

        <button
            id="addTask"
            class="main-action"
            type="button"
        >
            <span class="button-plus">+</span>
            ADD TASK
        </button>

        <button
            id="gridButton"
            class="tool-button"
            type="button"
        >
            GRID
        </button>

        <button
            id="pointerButton"
            class="tool-button"
            type="button"
        >
            POINTER
        </button>

    </section>


    <!-- EXTRA TOOLS -->

    <section class="secondary-tools">

        <button
            id="copyDayButton"
            class="secondary-button"
            type="button"
        >
            COPY DAY
        </button>

        <button
            id="presetsButton"
            class="secondary-button"
            type="button"
        >
            SAVED
        </button>

    </section>


    <!-- GRID PANEL -->

    <section
        id="gridPanel"
        class="global-panel collapsible hidden"
    >

        <div class="panel-top">

            <div>
                <h2>Grid</h2>
                <p>How your schedule is divided</p>
            </div>

            <button
                class="panel-close"
                data-close-panel="gridPanel"
                type="button"
            >
                ×
            </button>

        </div>


        <div
            id="gridLivePreview"
            class="schedule-mini-preview"
        ></div>


        <div class="setting-block">

            <div class="setting-label">
                STYLE
            </div>

            <div class="segmented-control">

                <button
                    data-grid-mode="rows"
                    type="button"
                >
                    ROWS
                </button>

                <button
                    data-grid-mode="grid"
                    type="button"
                >
                    GRID
                </button>

                <button
                    data-grid-mode="none"
                    type="button"
                >
                    NONE
                </button>

            </div>

        </div>


        <div class="setting-block">

            <div class="setting-row-title">
                <span>THICKNESS</span>
                <output id="gridThicknessValue">1</output>
            </div>

            <input
                id="gridThickness"
                type="range"
                min="1"
                max="5"
                step="1"
            >

        </div>


        <div class="setting-block">

            <div class="setting-row-title">
                <span>COLOR</span>
            </div>

            <button
                id="gridColorButton"
                class="color-button"
                type="button"
            >
                <span id="gridColorSwatch"></span>
                <span id="gridColorText">#E8E8E8</span>
            </button>

        </div>

    </section>


    <!-- POINTER PANEL -->

    <section
        id="pointerPanel"
        class="global-panel collapsible hidden"
    >

        <div class="panel-top">

            <div>
                <h2>Pointer</h2>
                <p>Current time indicator</p>
            </div>

            <button
                class="panel-close"
                data-close-panel="pointerPanel"
                type="button"
            >
                ×
            </button>

        </div>


        <div
            id="pointerLivePreview"
            class="pointer-live-preview"
        ></div>


        <div class="setting-block">

            <div class="setting-label">
                ICON
            </div>

            <button
                id="pointerIconButton"
                class="selector-button"
                type="button"
            >
                <span id="selectedPointerIcon"></span>
                <span>CHANGE ICON</span>
            </button>

        </div>


        <div class="setting-block">

            <div class="setting-row-title">
                <span>SIZE</span>
                <output id="pointerSizeValue">28</output>
            </div>

            <input
                id="pointerSize"
                type="range"
                min="10"
                max="70"
                step="1"
            >

        </div>


        <div class="setting-block">

            <div class="setting-row-title">
                <span>COLOR</span>
            </div>

            <button
                id="pointerColorButton"
                class="color-button"
                type="button"
            >
                <span id="pointerColorSwatch"></span>
                <span id="pointerColorText"></span>
            </button>

        </div>

    </section>


    <!-- COPY DAY PANEL -->

    <section
        id="copyDayPanel"
        class="global-panel collapsible hidden"
    >

        <div class="panel-top">

            <div>
                <h2>Copy day</h2>
                <p>Replace another day's schedule</p>
            </div>

            <button
                class="panel-close"
                data-close-panel="copyDayPanel"
                type="button"
            >
                ×
            </button>

        </div>


        <div
            id="copyDayChoices"
            class="day-choice-grid"
        ></div>

    </section>


    <!-- SAVED PANEL -->

    <section
        id="presetsPanel"
        class="global-panel collapsible hidden"
    >

        <div class="panel-top">

            <div>
                <h2>Saved schedules</h2>
                <p>Save days and full weeks</p>
            </div>

            <button
                class="panel-close"
                data-close-panel="presetsPanel"
                type="button"
            >
                ×
            </button>

        </div>


        <div class="preset-actions">

            <button
                id="saveDayPreset"
                type="button"
            >
                SAVE THIS DAY
            </button>

            <button
                id="saveWeekPreset"
                type="button"
            >
                SAVE FULL WEEK
            </button>

        </div>


        <div class="preset-section">

            <div class="setting-label">
                DAY PRESETS
            </div>

            <div
                id="dayPresetList"
                class="preset-list"
            ></div>

        </div>


        <div class="preset-section">

            <div class="setting-label">
                WEEK PRESETS
            </div>

            <div
                id="weekPresetList"
                class="preset-list"
            ></div>

        </div>

    </section>


    <!-- TASKS -->

    <section
        id="tasks"
        class="tasks"
    ></section>

</main>


<!-- CUSTOM MODAL -->

<div
    id="modalOverlay"
    class="modal-overlay hidden"
>

    <div
        id="modalBox"
        class="modal-box"
    ></div>

</div>


<!-- HIDDEN NATIVE COLOR PICKER -->

<input
    id="nativeColorPicker"
    type="color"
    class="native-color-picker"
>


<script
    type="module"
    src="editor.js"
></script>

</body>
</html>
