<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>Edit Schedule</title>

    <link
        rel="stylesheet"
        href="editor.css"
    >

</head>


<body>

<header class="editor-header">

    <a
        href="index.html"
        class="back"
        aria-label="Back"
    >
        ‹
    </a>


    <div class="header-info">

        <div class="editor-title">
            EDIT SCHEDULE
        </div>

        <div
            class="editor-subtitle"
            id="saveStatus"
        >
            READY
        </div>

    </div>


    <button
        id="saveButton"
        class="save-button"
        type="button"
    >
        SAVE
    </button>

</header>


<main class="editor">


    <!-- DAYS -->

    <nav class="day-tabs">

        <button data-day="MONDAY" type="button">
            MON
        </button>

        <button data-day="TUESDAY" type="button">
            TUE
        </button>

        <button data-day="WEDNESDAY" type="button">
            WED
        </button>

        <button data-day="THURSDAY" type="button">
            THU
        </button>

        <button data-day="FRIDAY" type="button">
            FRI
        </button>

        <button data-day="SATURDAY" type="button">
            SAT
        </button>

        <button data-day="SUNDAY" type="button">
            SUN
        </button>

    </nav>


    <!-- GLOBAL TOOLS -->

    <section class="global-tools">

        <button
            id="addTask"
            class="add-button"
            type="button"
        >
            +
            <span>ADD TASK</span>
        </button>


        <button
            id="gridButton"
            class="tool-button"
            type="button"
        >
            GRID
        </button>


        <button
            id="pointerButton"
            class="tool-button"
            type="button"
        >
            POINTER
        </button>

    </section>


    <!-- GRID -->

    <section
        id="gridPanel"
        class="global-panel hidden"
    >

        <div class="panel-heading">

            <div>

                <strong>GRID</strong>

                <span>
                    choose a style
                </span>

            </div>

            <button
                class="panel-close"
                data-close-panel="gridPanel"
                type="button"
            >
                ×
            </button>

        </div>


        <div class="grid-preview">

            <div class="preview-time">
                08:00
            </div>

            <div class="preview-content">

                <div class="preview-grid-line"></div>

                <div class="preview-task">
                    Morning routine
                </div>

                <div class="preview-grid-line"></div>

                <div class="preview-task">
                    Breakfast
                </div>

                <div class="preview-grid-line"></div>

            </div>

        </div>


        <div class="grid-choices">

            <button
                data-grid="clean"
                type="button"
            >
                <span class="grid-mini clean"></span>
                CLEAN
            </button>

            <button
                data-grid="dots"
                type="button"
            >
                <span class="grid-mini dots"></span>
                DOTS
            </button>

            <button
                data-grid="double"
                type="button"
            >
                <span class="grid-mini double"></span>
                DOUBLE
            </button>

            <button
                data-grid="soft"
                type="button"
            >
                <span class="grid-mini soft"></span>
                SOFT
            </button>

            <button
                data-grid="wave"
                type="button"
            >
                <span class="grid-mini wave"></span>
                WAVE
            </button>

        </div>


        <div class="small-color">

            <span>COLOR</span>

            <input
                type="color"
                id="gridColor"
            >

        </div>

    </section>


    <!-- POINTER -->

    <section
        id="pointerPanel"
        class="global-panel hidden"
    >

        <div class="panel-heading">

            <div>

                <strong>POINTER</strong>

                <span>
                    current time indicator
                </span>

            </div>

            <button
                class="panel-close"
                data-close-panel="pointerPanel"
                type="button"
            >
                ×
            </button>

        </div>


        <div class="pointer-preview">

            <div
                id="pointerPreview"
                class="pointer-preview-symbol"
            >
                ▶
            </div>

            <div class="pointer-preview-text">
                14:00
            </div>

        </div>


        <div class="pointer-controls">

            <label>

                <span>SYMBOL</span>

                <select id="pointerSymbol">

                    <option value="▶">▶</option>
                    <option value="♥">♥</option>
                    <option value="✦">✦</option>
                    <option value="✿">✿</option>
                    <option value="◆">◆</option>
                    <option value="●">●</option>
                    <option value="➜">➜</option>
                    <option value="★">★</option>
                    <option value="✧">✧</option>
                    <option value="❯">❯</option>
                    <option value="❋">❋</option>
                    <option value="☼">☼</option>

                </select>

            </label>


            <label>

                <span>COLOR</span>

                <input
                    type="color"
                    id="pointerColor"
                >

            </label>


            <label class="wide-control">

                <div class="range-label">

                    <span>SIZE</span>

                    <output id="pointerSizeValue">
                        28
                    </output>

                </div>

                <input
                    type="range"
                    id="pointerSize"
                    min="12"
                    max="70"
                    step="1"
                >

            </label>

        </div>


        <div class="gradient-toggle">

            <label>

                <input
                    type="checkbox"
                    id="pointerGradient"
                >

                <span>GRADIENT</span>

            </label>

        </div>


        <div
            id="pointerGradientOptions"
            class="gradient-options hidden"
        >

            <label>

                <span>START</span>

                <input
                    type="color"
                    id="pointerGradientStart"
                >

            </label>

            <label>

                <span>END</span>

                <input
                    type="color"
                    id="pointerGradientEnd"
                >

            </label>

        </div>

    </section>


    <!-- TASKS -->

    <section
        id="tasks"
        class="tasks"
    ></section>


</main>


<script
    type="module"
    src="editor.js"
></script>

</body>

</html>
