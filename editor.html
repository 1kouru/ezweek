<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1"
    >

    <meta name="theme-color" content="#f5f5f5">

    <title>Edit Schedule</title>

    <link rel="stylesheet" href="editor.css">
</head>

<body>

<header class="editor-header">

    <a href="index.html" class="back">‹</a>

    <div class="header-info">
        <div class="editor-title">EDIT SCHEDULE</div>
        <div class="editor-subtitle" id="saveStatus">READY</div>
    </div>

    <button id="saveButton" class="save-button">
        SAVE
    </button>

</header>


<main class="editor">

    <!-- DAYS -->

    <nav class="day-tabs">

        <button data-day="MONDAY">MON</button>
        <button data-day="TUESDAY">TUE</button>
        <button data-day="WEDNESDAY">WED</button>
        <button data-day="THURSDAY">THU</button>
        <button data-day="FRIDAY">FRI</button>
        <button data-day="SATURDAY">SAT</button>
        <button data-day="SUNDAY">SUN</button>

    </nav>


    <!-- TOOLS -->

    <section class="global-tools">

        <button id="addTask" class="add-button">
            <span class="plus">＋</span>
            ADD TASK
        </button>

        <button id="gridButton" class="tool-button">
            GRID
        </button>

        <button id="pointerButton" class="tool-button">
            POINTER
        </button>

    </section>


    <!-- GRID -->

    <section id="gridPanel" class="global-panel hidden">

        <div class="panel-top">

            <div>
                <div class="panel-title">Grid</div>
                <div class="panel-subtitle">Schedule lines</div>
            </div>

            <button class="close-panel" data-close="gridPanel">
                ×
            </button>

        </div>


        <div class="live-preview grid-live-preview">

            <div class="preview-time-column">
                <span>08:00</span>
                <span>09:00</span>
                <span>10:00</span>
            </div>

            <div
                class="grid-preview-area"
                id="gridPreviewArea"
            >

                <div class="preview-example-task">
                    Morning routine
                </div>

                <div class="preview-example-task second">
                    Breakfast
                </div>

            </div>

        </div>


        <div class="setting-label">
            LINES
        </div>

        <div class="segmented">

            <button
                class="grid-mode"
                data-mode="rows"
            >
                ROWS
            </button>

            <button
                class="grid-mode"
                data-mode="grid"
            >
                GRID
            </button>

        </div>


        <div class="setting-label">
            THICKNESS
        </div>

        <div class="range-box">

            <div class="range-head">
                <span>Line weight</span>
                <output id="gridThicknessValue">1</output>
            </div>

            <input
                id="gridThickness"
                type="range"
                min="1"
                max="3"
                step="1"
            >

        </div>


        <div class="color-row">

            <span>LINE COLOR</span>

            <button
                class="color-trigger"
                data-color-target="gridColor"
            >
                <span class="color-dot" id="gridColorDot"></span>
            </button>

        </div>

    </section>


    <!-- POINTER -->

    <section id="pointerPanel" class="global-panel hidden">

        <div class="panel-top">

            <div>
                <div class="panel-title">Pointer</div>
                <div class="panel-subtitle">Current time indicator</div>
            </div>

            <button class="close-panel" data-close="pointerPanel">
                ×
            </button>

        </div>


        <div class="live-preview pointer-live-preview">

            <div class="pointer-preview-icon" id="pointerPreviewIcon">
                <img src="icons/1.png" alt="">
            </div>

            <div class="pointer-preview-copy">
                <strong>14:00</strong>
                <span>Current time</span>
            </div>

        </div>


        <div class="setting-label">
            ICON
        </div>

        <button
            class="custom-select-button"
            id="iconPickerButton"
        >

            <span id="selectedIconPreview">
                <img src="icons/1.png" alt="">
            </span>

            <span>Select icon</span>

            <b>⌄</b>

        </button>


        <div id="iconPicker" class="custom-popup hidden">

            <div class="popup-title">
                Choose pointer
            </div>

            <div class="icon-grid">

                <button data-icon="1">
                    <img src="icons/1.png" alt="">
                </button>

                <button data-icon="2">
                    <img src="icons/2.png" alt="">
                </button>

                <button data-icon="3">
                    <img src="icons/3.png" alt="">
                </button>

                <button data-icon="4">
                    <img src="icons/4.png" alt="">
                </button>

                <button data-icon="5">
                    <img src="icons/5.png" alt="">
                </button>

                <button data-icon="6">
                    <img src="icons/6.png" alt="">
                </button>

                <button data-icon="7">
                    <img src="icons/7.png" alt="">
                </button>

                <button data-icon="8">
                    <img src="icons/8.png" alt="">
                </button>

                <button data-icon="9">
                    <img src="icons/9.png" alt="">
                </button>

                <button data-icon="10">
                    <img src="icons/10.png" alt="">
                </button>

            </div>

        </div>


        <div class="two-controls">

            <div class="range-box">

                <div class="range-head">
                    <span>SIZE</span>
                    <output id="pointerSizeValue">28</output>
                </div>

                <input
                    id="pointerSize"
                    type="range"
                    min="12"
                    max="70"
                >

            </div>

            <div class="color-row compact-color-row">

                <span>COLOR</span>

                <button
                    class="color-trigger"
                    data-color-target="pointerColor"
                >
                    <span class="color-dot" id="pointerColorDot"></span>
                </button>

            </div>

        </div>


        <div class="gradient-row">

            <label>
                <input type="checkbox" id="pointerGradient">
                <span>Gradient</span>
            </label>

        </div>


        <div
            id="pointerGradientBox"
            class="gradient-box hidden"
        >

            <div class="gradient-color-item">

                <span>START</span>

                <button
                    class="color-trigger"
                    data-color-target="pointerGradientStart"
                >
                    <span class="color-dot" id="pointerGradientStartDot"></span>
                </button>

            </div>

            <div class="gradient-color-item">

                <span>END</span>

                <button
                    class="color-trigger"
                    data-color-target="pointerGradientEnd"
                >
                    <span class="color-dot" id="pointerGradientEndDot"></span>
                </button>

            </div>

        </div>

    </section>


    <!-- TASKS -->

    <section id="tasks"></section>

</main>


<!-- COLOR PICKER -->

<div id="colorOverlay" class="overlay hidden">

    <div class="picker-sheet">

        <div class="picker-header">

            <div>
                <strong>Color</strong>
                <span>Choose a color</span>
            </div>

            <button id="closeColorPicker">
                ×
            </button>

        </div>


        <div class="color-section-title">
            BASIC
        </div>

        <div class="basic-colors">

            <button data-preset="#111111"></button>
            <button data-preset="#ffffff"></button>
            <button data-preset="#8B8B8B"></button>
            <button data-preset="#FF4ECD"></button>
            <button data-preset="#7C5CFF"></button>
            <button data-preset="#FF5C5C"></button>
            <button data-preset="#FF9F43"></button>
            <button data-preset="#FFD166"></button>
            <button data-preset="#6BCB77"></button>
            <button data-preset="#4D96FF"></button>
            <button data-preset="#00C2A8"></button>
            <button data-preset="#B86BFF"></button>

        </div>


        <div class="color-section-title recent-title">
            RECENT
        </div>

        <div id="recentColors" class="recent-colors"></div>


        <button id="systemColorButton" class="system-color-button">
            <span>＋</span>
            Pick another color
        </button>

        <input
            id="systemColorInput"
            type="color"
            class="real-color-input"
        >

    </div>

</div>


<!-- FONT PICKER -->

<div id="fontOverlay" class="overlay hidden">

    <div class="font-sheet">

        <div class="picker-header">

            <div>
                <strong>Font</strong>
                <span>Choose typography</span>
            </div>

            <button id="closeFontPicker">
                ×
            </button>

        </div>


        <div id="fontList" class="font-list"></div>

    </div>

</div>


<script type="module" src="editor.js"></script>

</body>
</html>
