<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#f5f5f5"
    >

    <title>Edit Schedule</title>

    <link rel="stylesheet" href="editor.css">
</head>

<body>

<header class="editor-header">

    <a href="index.html" class="back">
        ‹
    </a>

    <div class="header-info">
        <div class="editor-title">
            EDIT SCHEDULE
        </div>

        <div
            class="editor-subtitle"
            id="saveStatus"
        >
            READY
        </div>
    </div>

    <button
        id="saveButton"
        class="save-button"
        type="button"
    >
        SAVE
    </button>

</header>


<main class="editor">

    <!-- DAYS -->

    <nav class="day-tabs">

        <button data-day="MONDAY" type="button">MON</button>
        <button data-day="TUESDAY" type="button">TUE</button>
        <button data-day="WEDNESDAY" type="button">WED</button>
        <button data-day="THURSDAY" type="button">THU</button>
        <button data-day="FRIDAY" type="button">FRI</button>
        <button data-day="SATURDAY" type="button">SAT</button>
        <button data-day="SUNDAY" type="button">SUN</button>

    </nav>


    <!-- TOOLS -->

    <section class="global-tools">

        <button
            id="addTask"
            class="add-button"
            type="button"
        >
            <b>+</b>
            <span>ADD TASK</span>
        </button>

        <button
            id="gridButton"
            class="tool-button"
            type="button"
        >
            <span class="tool-icon">▦</span>
            GRID
        </button>

        <button
            id="pointerButton"
            class="tool-button"
            type="button"
        >
            <span class="tool-icon">◆</span>
            POINTER
        </button>

    </section>


    <!-- GRID -->

    <section
        id="gridPanel"
        class="global-panel hidden"
    >

        <div class="panel-heading">

            <div>
                <strong>GRID</strong>
                <span>schedule lines</span>
            </div>

            <button
                class="panel-close"
                data-close-panel="gridPanel"
                type="button"
            >
                ×
            </button>

        </div>


        <div class="settings-preview grid-real-preview">

            <div class="real-preview-time">
                08:30
            </div>

            <div class="real-preview-task">
                <span class="real-preview-icon"></span>
                <span class="real-preview-name">
                    Morning routine
                </span>
            </div>

            <div class="preview-line line-a"></div>
            <div class="preview-line line-b"></div>
            <div class="preview-vertical"></div>

        </div>


        <div class="grid-mode">

            <button
                type="button"
                data-grid-mode="rows"
            >
                <span class="mode-preview rows-preview"></span>

                <div>
                    <b>ROWS</b>
                    <small>lines between tasks</small>
                </div>
            </button>


            <button
                type="button"
                data-grid-mode="grid"
            >
                <span class="mode-preview grid-preview-icon"></span>

                <div>
                    <b>GRID</b>
                    <small>time + task separator</small>
                </div>
            </button>

        </div>


        <div class="grid-setting-row">

            <div class="setting-info">
                <b>LINE</b>
                <span id="gridThicknessValue">1 px</span>
            </div>

            <input
                id="gridThickness"
                type="range"
                min="1"
                max="3"
                step="1"
            >

        </div>


        <div class="color-setting">

            <span>COLOR</span>

            <button
                type="button"
                class="color-trigger"
                data-color-target="gridColor"
            >
                <span class="color-circle"></span>
                <span class="color-value">#E8E8E8</span>
            </button>

        </div>

    </section>


    <!-- POINTER -->

    <section
        id="pointerPanel"
        class="global-panel hidden"
    >

        <div class="panel-heading">

            <div>
                <strong>POINTER</strong>
                <span>current time indicator</span>
            </div>

            <button
                class="panel-close"
                data-close-panel="pointerPanel"
                type="button"
            >
                ×
            </button>

        </div>


        <div class="settings-preview pointer-real-preview">

            <div class="pointer-preview-icon"></div>

            <div class="pointer-preview-time">
                08:30
            </div>

            <div class="pointer-preview-task">
                Morning routine
            </div>

        </div>


        <div class="pointer-options">

            <button
                type="button"
                id="iconPickerButton"
                class="setting-big-button"
            >
                <span
                    id="selectedIcon"
                    class="icon-display"
                ></span>

                <span>
                    <b>ICON</b>
                    <small>choose pointer</small>
                </span>

                <i>›</i>
            </button>


            <div class="color-setting">

                <span>COLOR</span>

                <button
                    type="button"
                    class="color-trigger"
                    data-color-target="pointerColor"
                >
                    <span class="color-circle"></span>
                    <span class="color-value">#111111</span>
                </button>

            </div>


            <div class="slider-setting">

                <div>
                    <b>SIZE</b>
                    <output id="pointerSizeValue">24</output>
                </div>

                <input
                    id="pointerSize"
                    type="range"
                    min="12"
                    max="48"
                    step="1"
                >

            </div>

        </div>


        <div class="gradient-mini-toggle">

            <label>

                <input
                    type="checkbox"
                    id="pointerGradient"
                >

                <span>GRADIENT</span>

            </label>

        </div>


        <div
            id="pointerGradientOptions"
            class="gradient-mini-options hidden"
        >

            <button
                class="color-trigger"
                data-color-target="pointerGradientStart"
            >
                <span class="color-circle"></span>
                <span class="color-value"></span>
            </button>

            <button
                class="color-trigger"
                data-color-target="pointerGradientEnd"
            >
                <span class="color-circle"></span>
                <span class="color-value"></span>
            </button>

        </div>

    </section>


    <!-- TASKS -->

    <section id="tasks" class="tasks"></section>

</main>


<!-- COLOR PICKER -->

<div
    id="colorModal"
    class="modal hidden"
>

    <div class="modal-backdrop"></div>

    <div class="color-modal">

        <div class="modal-header">

            <div>
                <b>COLOR</b>
                <span>choose a color</span>
            </div>

            <button
                id="closeColorModal"
                type="button"
            >
                ×
            </button>

        </div>


        <div class="color-preview-large">
            <span id="largeColorPreview"></span>

            <div>
                <b id="largeColorHex">#111111</b>
                <small>selected color</small>
            </div>
        </div>


        <div class="color-title">
            BASIC
        </div>

        <div
            id="basicColors"
            class="color-grid"
        ></div>


        <div class="color-title recent-title">
            RECENT
        </div>

        <div
            id="recentColors"
            class="color-grid"
        ></div>


        <button
            id="systemColorButton"
            class="system-color-button"
            type="button"
        >
            <span>＋</span>
            PICK CUSTOM COLOR
        </button>

        <input
            id="systemColorInput"
            type="color"
            class="system-color-input"
        >

    </div>

</div>


<!-- FONT PICKER -->

<div
    id="fontModal"
    class="modal hidden"
>

    <div class="modal-backdrop"></div>

    <div class="font-modal">

        <div class="modal-header">

            <div>
                <b>FONT</b>
                <span>choose typeface</span>
            </div>

            <button
                id="closeFontModal"
                type="button"
            >
                ×
            </button>

        </div>


        <div
            id="fontList"
            class="font-list"
        ></div>

    </div>

</div>


<!-- ICON PICKER -->

<div
    id="iconModal"
    class="modal hidden"
>

    <div class="modal-backdrop"></div>

    <div class="icon-modal">

        <div class="modal-header">

            <div>
                <b>ICON</b>
                <span>choose pointer icon</span>
            </div>

            <button
                id="closeIconModal"
                type="button"
            >
                ×
            </button>

        </div>


        <div
            id="iconList"
            class="icon-list"
        ></div>

    </div>

</div>


<script
    type="module"
    src="editor.js"
></script>

</body>
</html>
