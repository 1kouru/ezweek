<!DOCTYPE html>
<html lang="ru">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#f5f5f5"
    >

    <title>Edit Schedule</title>

    <link
        rel="stylesheet"
        href="editor.css"
    >

</head>


<body>

<header class="editor-header">

    <a
        href="index.html"
        class="back"
        aria-label="Back"
    >
        ‹
    </a>

    <div class="header-info">

        <div class="editor-title">
            EDIT SCHEDULE
        </div>

        <div
            class="editor-subtitle"
            id="saveStatus"
        >
            READY
        </div>

    </div>

    <button
        id="saveButton"
        class="save-button"
        type="button"
    >
        SAVE
    </button>

</header>


<main class="editor">

    <!-- DAYS -->

    <nav class="day-tabs">

        <button data-day="MONDAY" type="button">MON</button>
        <button data-day="TUESDAY" type="button">TUE</button>
        <button data-day="WEDNESDAY" type="button">WED</button>
        <button data-day="THURSDAY" type="button">THU</button>
        <button data-day="FRIDAY" type="button">FRI</button>
        <button data-day="SATURDAY" type="button">SAT</button>
        <button data-day="SUNDAY" type="button">SUN</button>

    </nav>


    <!-- TOOLS -->

    <section class="global-tools">

        <button
            id="addTask"
            class="add-button"
            type="button"
        >
            <span class="plus">+</span>
            <span>ADD TASK</span>
        </button>

        <button
            id="gridButton"
            class="tool-button"
            type="button"
        >
            <span class="tool-icon">▦</span>
            GRID
        </button>

        <button
            id="pointerButton"
            class="tool-button"
            type="button"
        >
            <span class="tool-icon">›</span>
            POINTER
        </button>

    </section>


    <!-- GRID -->

    <section
        id="gridPanel"
        class="global-panel hidden"
    >

        <div class="panel-top">

            <div>
                <div class="panel-title">GRID</div>
                <div class="panel-subtitle">
                    schedule lines
                </div>
            </div>

            <button
                class="panel-close"
                data-close-panel="gridPanel"
                type="button"
            >
                ×
            </button>

        </div>


        <div
            id="gridPreview"
            class="grid-preview grid-clean"
        >

            <div class="grid-preview-time">
                08:00
            </div>

            <div class="grid-preview-body">

                <div class="grid-row">

                    <div class="grid-example-time">
                        08:00
                    </div>

                    <div class="grid-example-task">
                        Morning routine
                    </div>

                </div>

                <div class="grid-row">

                    <div class="grid-example-time">
                        09:00
                    </div>

                    <div class="grid-example-task">
                        Breakfast
                    </div>

                </div>

                <div class="grid-row">

                    <div class="grid-example-time">
                        10:00
                    </div>

                    <div class="grid-example-task">
                        Study
                    </div>

                </div>

                <div class="grid-row">

                    <div class="grid-example-time">
                        11:00
                    </div>

                    <div class="grid-example-task">
                        Walk
                    </div>

                </div>

            </div>

        </div>


        <div class="grid-options">

            <button data-grid="clean" type="button">
                <span class="grid-icon clean"></span>
                <span>Clean</span>
            </button>

            <button data-grid="dots" type="button">
                <span class="grid-icon dots"></span>
                <span>Dots</span>
            </button>

            <button data-grid="double" type="button">
                <span class="grid-icon double"></span>
                <span>Double</span>
            </button>

            <button data-grid="soft" type="button">
                <span class="grid-icon soft"></span>
                <span>Soft</span>
            </button>

            <button data-grid="wave" type="button">
                <span class="grid-icon wave"></span>
                <span>Wave</span>
            </button>

        </div>


        <div class="setting-line">

            <span>Line color</span>

            <button
                id="gridColorButton"
                class="color-swatch"
                type="button"
            ></button>

            <input
                id="gridColor"
                class="native-color"
                type="color"
            >

        </div>

    </section>


    <!-- POINTER -->

    <section
        id="pointerPanel"
        class="global-panel hidden"
    >

        <div class="panel-top">

            <div>
                <div class="panel-title">POINTER</div>
                <div class="panel-subtitle">
                    current time
                </div>
            </div>

            <button
                class="panel-close"
                data-close-panel="pointerPanel"
                type="button"
            >
                ×
            </button>

        </div>


        <div class="pointer-preview">

            <div
                id="pointerPreview"
                class="pointer-preview-icon"
            >
                <span class="pointer-fallback">›</span>
            </div>

            <div class="pointer-preview-info">

                <strong>14:00</strong>

                <span>
                    current task
                </span>

            </div>

        </div>


        <div class="pointer-settings">

            <div class="setting-line">

                <span>Symbol</span>

                <button
                    id="pointerSymbolButton"
                    class="symbol-button"
                    type="button"
                >
                    <span
                        id="pointerSymbolIcon"
                        class="selected-symbol"
                    ></span>
                </button>

            </div>


            <div class="setting-line">

                <span>Color</span>

                <button
                    id="pointerColorButton"
                    class="color-swatch"
                    type="button"
                ></button>

                <input
                    id="pointerColor"
                    class="native-color"
                    type="color"
                >

            </div>


            <div class="range-row">

                <div class="range-name">
                    Size
                </div>

                <input
                    id="pointerSize"
                    type="range"
                    min="12"
                    max="60"
                    step="1"
                >

                <output id="pointerSizeValue">
                    28
                </output>

            </div>


            <div class="toggle-line">

                <span>Gradient</span>

                <label class="switch">

                    <input
                        type="checkbox"
                        id="pointerGradient"
                    >

                    <span></span>

                </label>

            </div>


            <div
                id="pointerGradientOptions"
                class="gradient-mini hidden"
            >

                <button
                    id="pointerGradientStartButton"
                    class="gradient-color"
                    type="button"
                ></button>

                <button
                    id="pointerGradientEndButton"
                    class="gradient-color"
                    type="button"
                ></button>

                <input
                    id="pointerGradientStart"
                    class="native-color"
                    type="color"
                >

                <input
                    id="pointerGradientEnd"
                    class="native-color"
                    type="color"
                >

            </div>

        </div>

    </section>


    <!-- SYMBOL POPUP -->

    <div
        id="symbolPopup"
        class="floating-popup hidden"
    >

        <div class="popup-title">
            SYMBOL
        </div>

        <div
            id="symbolGrid"
            class="symbol-grid"
        ></div>

    </div>


    <!-- COLOR POPUP -->

    <div
        id="colorPopup"
        class="color-popup hidden"
    >

        <div class="popup-title">
            COLOR
        </div>

        <div class="color-preview-row">

            <div
                id="colorPreview"
                class="big-color-preview"
            ></div>

            <div>
                <div class="color-name">
                    Custom color
                </div>

                <div class="color-hint">
                    tap below to choose
                </div>
            </div>

        </div>

        <input
            id="popupColorInput"
            type="color"
        >

    </div>


    <!-- TASKS -->

    <section
        id="tasks"
        class="tasks"
    ></section>


</main>


<script
    type="module"
    src="editor.js"
></script>

</body>

</html>
