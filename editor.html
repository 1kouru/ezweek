<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>Edit Schedule</title>

    <link
        rel="stylesheet"
        href="editor.css"
    >

</head>


<body>


<header class="editor-header">

    <a
        href="index.html"
        class="back"
        aria-label="Back"
    >
        ‹
    </a>


    <div class="header-info">

        <div class="editor-title">
            EDIT SCHEDULE
        </div>

        <div
            class="editor-subtitle"
            id="saveStatus"
        >
            READY
        </div>

    </div>


    <button
        id="saveButton"
        class="save-button"
        type="button"
    >
        SAVE
    </button>

</header>



<main class="editor">


    <!-- =========================================
         DAYS
    ========================================== -->

    <div class="day-tabs">

        <button data-day="MONDAY">
            MON
        </button>

        <button data-day="TUESDAY">
            TUE
        </button>

        <button data-day="WEDNESDAY">
            WED
        </button>

        <button data-day="THURSDAY">
            THU
        </button>

        <button data-day="FRIDAY">
            FRI
        </button>

        <button data-day="SATURDAY">
            SAT
        </button>

        <button data-day="SUNDAY">
            SUN
        </button>

    </div>



    <!-- =========================================
         LIVE PREVIEW
    ========================================== -->

    <section class="preview-section">

        <div class="section-heading">

            <div>
                LIVE PREVIEW
            </div>

            <span id="previewDay">
                MON
            </span>

        </div>


        <div
            class="preview"
            id="preview"
        >

            <div
                class="preview-grid"
                id="previewGrid"
            ></div>


            <div
                class="preview-pointer"
                id="previewPointer"
            >
                ▶
            </div>


            <div
                class="preview-tasks"
                id="previewTasks"
            ></div>

        </div>

    </section>



    <!-- =========================================
         TOOLBAR
    ========================================== -->

    <section class="toolbar">

        <button
            id="addTask"
            class="primary-button"
            type="button"
        >
            + ADD TASK
        </button>


        <button
            id="gridButton"
            class="secondary-button"
            type="button"
        >
            GRID
        </button>


        <button
            id="pointerButton"
            class="secondary-button"
            type="button"
        >
            POINTER
        </button>

    </section>



    <!-- =========================================
         TASKS
    ========================================== -->

    <section
        id="tasks"
        class="tasks"
    ></section>



    <!-- =========================================
         GRID PANEL
    ========================================== -->

    <section
        id="gridPanel"
        class="settings-panel hidden"
    >

        <div class="panel-title">
            GRID STYLE
        </div>


        <div class="choice-grid">

            <button data-grid="clean">
                CLEAN
            </button>

            <button data-grid="dots">
                DOTS
            </button>

            <button data-grid="double">
                DOUBLE
            </button>

            <button data-grid="soft">
                SOFT
            </button>

            <button data-grid="wave">
                WAVE
            </button>

        </div>


        <div class="global-control">

            <span>
                GRID COLOR
            </span>

            <input
                type="color"
                id="gridColor"
            >

        </div>

    </section>



    <!-- =========================================
         POINTER PANEL
    ========================================== -->

    <section
        id="pointerPanel"
        class="settings-panel hidden"
    >

        <div class="panel-title">
            TIME POINTER
        </div>


        <div class="global-control">

            <span>
                SYMBOL
            </span>

            <select id="pointerSymbol">

                <option value="▶">
                    ▶ Triangle
                </option>

                <option value="♥">
                    ♥ Heart
                </option>

                <option value="✦">
                    ✦ Star
                </option>

                <option value="✿">
                    ✿ Flower
                </option>

                <option value="◆">
                    ◆ Diamond
                </option>

                <option value="●">
                    ● Circle
                </option>

                <option value="➜">
                    ➜ Arrow
                </option>

            </select>

        </div>


        <div class="global-control">

            <span>
                COLOR
            </span>

            <input
                type="color"
                id="pointerColor"
            >

        </div>


        <div class="global-control">

            <span>
                SIZE
            </span>

            <div class="range-line">

                <input
                    type="range"
                    id="pointerSize"
                    min="12"
                    max="80"
                    step="1"
                >

                <output id="pointerSizeValue">
                    28
                </output>

            </div>

        </div>


        <label class="switch-row">

            <input
                type="checkbox"
                id="pointerGradient"
            >

            <span>
                GRADIENT
            </span>

        </label>


        <div
            id="pointerGradientOptions"
            class="gradient-options"
        >

            <div class="global-control">

                <span>
                    START
                </span>

                <input
                    type="color"
                    id="pointerGradientStart"
                >

            </div>


            <div class="global-control">

                <span>
                    END
                </span>

                <input
                    type="color"
                    id="pointerGradientEnd"
                >

            </div>

        </div>

    </section>


</main>



<!-- =========================================
     DELETE MODAL
========================================== -->

<div
    class="modal-backdrop hidden"
    id="deleteModal"
>

    <div class="confirm-modal">

        <div class="confirm-title">
            DELETE TASK?
        </div>

        <div
            class="confirm-text"
            id="deleteText"
        >
            Are you sure?
        </div>


        <div class="confirm-buttons">

            <button
                id="cancelDelete"
                type="button"
            >
                CANCEL
            </button>

            <button
                id="confirmDelete"
                class="danger"
                type="button"
            >
                DELETE
            </button>

        </div>

    </div>

</div>



<script
    type="module"
    src="editor.js"
></script>


</body>

</html>
