<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover"
    >

    <title>Edit Schedule</title>

    <link
        rel="stylesheet"
        href="editor.css"
    >

</head>


<body>

<header class="editor-header">

    <a
        href="index.html"
        class="back-button"
        aria-label="Back"
    >
        ‹
    </a>


    <div class="header-info">

        <div class="editor-title">
            EDITOR
        </div>

        <div
            class="editor-subtitle"
            id="saveStatus"
        >
            READY
        </div>

    </div>


    <button
        id="saveButton"
        class="save-button"
        type="button"
    >
        SAVE
    </button>

</header>


<main class="editor">


    <!-- =========================
         DAYS
    ========================== -->

    <section class="days-section">

        <div class="section-label">
            DAY
        </div>


        <div class="day-tabs">

            <button data-day="MONDAY">
                MON
            </button>

            <button data-day="TUESDAY">
                TUE
            </button>

            <button data-day="WEDNESDAY">
                WED
            </button>

            <button data-day="THURSDAY">
                THU
            </button>

            <button data-day="FRIDAY">
                FRI
            </button>

            <button data-day="SATURDAY">
                SAT
            </button>

            <button data-day="SUNDAY">
                SUN
            </button>

        </div>

    </section>


    <!-- =========================
         QUICK ACTIONS
    ========================== -->

    <section class="quick-actions">

        <button
            id="addTask"
            class="quick-button add-button"
            type="button"
        >
            <span class="quick-icon">＋</span>
            <span>ADD TASK</span>
        </button>


        <button
            id="gridButton"
            class="quick-button"
            type="button"
        >
            <span class="quick-icon">▦</span>
            <span>GRID</span>
        </button>


        <button
            id="pointerButton"
            class="quick-button"
            type="button"
        >
            <span class="quick-icon">✦</span>
            <span>POINTER</span>
        </button>

    </section>


    <!-- =========================
         GRID PANEL
    ========================== -->

    <section
        id="gridPanel"
        class="settings-panel hidden"
    >

        <div class="panel-header">

            <div>

                <div class="panel-title">
                    GRID
                </div>

                <div class="panel-description">
                    Choose the visual structure of your schedule.
                </div>

            </div>


            <button
                class="panel-close"
                data-close-panel="grid"
                type="button"
            >
                ×
            </button>

        </div>


        <div class="setting-block">

            <div class="setting-title">
                STYLE
            </div>


            <div class="grid-choices">

                <button data-grid="clean">
                    <span class="grid-preview clean-preview"></span>
                    <span>CLEAN</span>
                </button>


                <button data-grid="dots">
                    <span class="grid-preview dots-preview"></span>
                    <span>DOTS</span>
                </button>


                <button data-grid="double">
                    <span class="grid-preview double-preview"></span>
                    <span>DOUBLE</span>
                </button>


                <button data-grid="soft">
                    <span class="grid-preview soft-preview"></span>
                    <span>SOFT</span>
                </button>


                <button data-grid="wave">
                    <span class="grid-preview wave-preview"></span>
                    <span>WAVE</span>
                </button>

            </div>

        </div>


        <div class="setting-block">

            <label class="setting-title">
                GRID COLOR
            </label>

            <div class="color-control">

                <input
                    type="color"
                    id="gridColor"
                >

                <span id="gridColorValue">
                    #E8E8E8
                </span>

            </div>

        </div>

    </section>


    <!-- =========================
         POINTER PANEL
    ========================== -->

    <section
        id="pointerPanel"
        class="settings-panel hidden"
    >

        <div class="panel-header">

            <div>

                <div class="panel-title">
                    POINTER
                </div>

                <div class="panel-description">
                    Customize the marker for the current time.
                </div>

            </div>


            <button
                class="panel-close"
                data-close-panel="pointer"
                type="button"
            >
                ×
            </button>

        </div>


        <div class="setting-block">

            <label class="setting-title">
                SYMBOL
            </label>


            <select
                id="pointerSymbol"
                class="full-select"
            >

                <option value="▶">▶ Triangle</option>
                <option value="♥">♥ Heart</option>
                <option value="✦">✦ Star</option>
                <option value="✿">✿ Flower</option>
                <option value="◆">◆ Diamond</option>
                <option value="●">● Circle</option>
                <option value="➜">➜ Arrow</option>
                <option value="★">★ Star 2</option>
                <option value="☀">☀ Sun</option>
                <option value="☁">☁ Cloud</option>
                <option value="♡">♡ Heart outline</option>
                <option value="✧">✧ Spark</option>
                <option value="❖">❖ Crystal</option>
                <option value="◈">◈ Diamond 2</option>

            </select>

        </div>


        <div class="setting-block">

            <label class="setting-title">
                COLOR
            </label>


            <div class="color-control">

                <input
                    type="color"
                    id="pointerColor"
                >

                <span id="pointerColorValue">
                    #111111
                </span>

            </div>

        </div>


        <div class="setting-block">

            <label class="setting-title">
                SIZE
            </label>


            <div class="range-line">

                <input
                    type="range"
                    id="pointerSize"
                    min="16"
                    max="80"
                    step="1"
                >

                <output id="pointerSizeValue">
                    28
                </output>

            </div>

        </div>


        <div class="setting-block">

            <label class="toggle-row">

                <span>

                    <strong>
                        GRADIENT
                    </strong>

                    <small>
                        Use a two-color gradient.
                    </small>

                </span>


                <input
                    type="checkbox"
                    id="pointerGradient"
                >

                <span class="toggle"></span>

            </label>

        </div>


        <div
            id="pointerGradientOptions"
            class="gradient-options hidden"
        >

            <div>

                <div class="setting-title">
                    START
                </div>

                <input
                    type="color"
                    id="pointerGradientStart"
                    class="big-color"
                >

            </div>


            <div>

                <div class="setting-title">
                    END
                </div>

                <input
                    type="color"
                    id="pointerGradientEnd"
                    class="big-color"
                >

            </div>

        </div>

    </section>


    <!-- =========================
         TASKS
    ========================== -->

    <section class="tasks-section">

        <div class="tasks-heading">

            <div>

                <div class="section-label">
                    SCHEDULE
                </div>

                <div
                    class="selected-day-title"
                    id="selectedDayTitle"
                >
                    MONDAY
                </div>

            </div>

        </div>


        <div
            id="tasks"
            class="tasks"
        ></div>

    </section>


</main>


<script
    type="module"
    src="editor.js"
></script>

</body>

</html>
