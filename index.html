<!DOCTYPE html>
<html lang="ru">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>Routine</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>

    <main class="app">

        <header class="header">

            <div
                class="day"
                id="dayName"
            >
                THURSDAY
            </div>

            <div
                class="time"
                id="currentTime"
            >
                00:00
            </div>

        </header>


        <section class="schedule">

            <div class="image-wrapper">

                <img
                    id="scheduleImage"
                    src=""
                    alt="Today's schedule"
                >

                <div class="pointer">

                    <div class="triangle"></div>

                </div>

            </div>

        </section>


    </main>


    <script src="script.js"></script>

</body>

</html>
