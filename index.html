<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no"
    >

    <title>Routine</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>

    <main class="app">


        <!-- HEADER -->

        <header class="header">

            <div
                class="day"
                id="dayName"
            >
                MONDAY
            </div>

            <div
                class="time"
                id="currentTime"
            >
                00:00
            </div>

        </header>


        <!-- MENU BUTTON -->

        <button
            class="menu-button"
            id="menuButton"
            type="button"
            aria-label="Menu"
        >

            <span></span>

            <span></span>

            <span></span>

        </button>


        <!-- DAY NAVIGATION -->

        <div class="day-navigation">

            <button
                class="nav-button"
                id="prevDay"
                type="button"
            >
                ‹
            </button>


            <button
                class="selected-day"
                id="selectedDayButton"
                type="button"
            >

                <span
                    class="selected-day-label"
                    id="selectedDayLabel"
                >
                    TODAY
                </span>

                <span
                    class="selected-day-name"
                    id="selectedDayName"
                >
                    MONDAY
                </span>

            </button>


            <button
                class="nav-button"
                id="nextDay"
                type="button"
            >
                ›
            </button>

        </div>


        <!-- TODAY -->

        <button
            class="today-button"
            id="todayButton"
            type="button"
        >
            TODAY
        </button>


        <!-- SCHEDULE -->

        <section
            class="schedule"
            id="schedule"
        >

            <div class="image-wrapper">

                <img
                    id="scheduleImage"
                    src=""
                    alt="Schedule"
                >

                <div class="pointer">

                    <div class="triangle"></div>

                </div>

            </div>

        </section>


        <!-- BOTTOM DAYS -->

        <nav class="bottom-navigation">

            <div class="days-scroll">

                <button
                    class="day-button"
                    data-day="MONDAY"
                    type="button"
                >
                    MON
                    <span class="day-indicator"></span>
                </button>


                <button
                    class="day-button"
                    data-day="TUESDAY"
                    type="button"
                >
                    TUE
                    <span class="day-indicator"></span>
                </button>


                <button
                    class="day-button"
                    data-day="WEDNESDAY"
                    type="button"
                >
                    WED
                    <span class="day-indicator"></span>
                </button>


                <button
                    class="day-button"
                    data-day="THURSDAY"
                    type="button"
                >
                    THU
                    <span class="day-indicator"></span>
                </button>


                <button
                    class="day-button"
                    data-day="FRIDAY"
                    type="button"
                >
                    FRI
                    <span class="day-indicator"></span>
                </button>


                <button
                    class="day-button"
                    data-day="SATURDAY"
                    type="button"
                >
                    SAT
                    <span class="day-indicator"></span>
                </button>


                <button
                    class="day-button"
                    data-day="SUNDAY"
                    type="button"
                >
                    SUN
                    <span class="day-indicator"></span>
                </button>

            </div>

        </nav>


        <!-- MENU OVERLAY -->

        <div
            class="menu-overlay"
            id="menuOverlay"
        ></div>


        <!-- SIDE MENU -->

        <aside
            class="side-menu"
            id="sideMenu"
        >

            <div class="menu-top">

                <button
                    class="close-menu"
                    id="closeMenu"
                    type="button"
                >
                    ×
                </button>

            </div>


            <div class="menu-profile">

                <div
                    class="menu-avatar"
                    id="menuAvatar"
                >
                    R
                </div>


                <div class="menu-user-info">

                    <div
                        class="menu-username"
                        id="menuUsername"
                    >
                        USER
                    </div>

                    <div
                        class="menu-email"
                        id="menuEmail"
                    >
                        user@email.com
                    </div>

                </div>

            </div>


            <div class="menu-links">

                <a
                    href="profile.html"
                    class="menu-link"
                >
                    <span>
                        PROFILE
                    </span>

                    <span class="menu-arrow">
                        ›
                    </span>
                </a>


                <a
                    href="index.html"
                    class="menu-link active"
                >
                    <span>
                        SCHEDULE
                    </span>

                    <span class="menu-arrow">
                        ›
                    </span>
                </a>

            </div>


            <button
                class="logout-button"
                id="logoutButton"
                type="button"
            >
                LOG OUT
            </button>

        </aside>


    </main>


<script type="module" src="script.js"></script>
<script src="menu.js"></script>

</body>

</html>
