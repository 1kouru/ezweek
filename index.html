<!DOCTYPE html>
<html lang="ru">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>Routine</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>

    <main class="app">

        <!-- =========================================
             HEADER
        ========================================== -->

        <header class="header">

            <div
                class="day"
                id="dayName"
            >
                THURSDAY
            </div>

            <div
                class="time"
                id="currentTime"
            >
                00:00
            </div>

        </header>


        <!-- =========================================
             DAY NAVIGATION
        ========================================== -->

        <nav
            class="day-navigation"
            aria-label="Schedule navigation"
        >

            <button
                class="nav-arrow"
                id="prevDay"
                type="button"
                aria-label="Previous day"
            >
                ‹
            </button>


            <div
                class="days"
                id="daysList"
            >

                <button
                    class="day-button"
                    data-day="MONDAY"
                    type="button"
                >
                    <span>MON</span>
                </button>

                <button
                    class="day-button"
                    data-day="TUESDAY"
                    type="button"
                >
                    <span>TUE</span>
                </button>

                <button
                    class="day-button"
                    data-day="WEDNESDAY"
                    type="button"
                >
                    <span>WED</span>
                </button>

                <button
                    class="day-button"
                    data-day="THURSDAY"
                    type="button"
                >
                    <span>THU</span>
                </button>

                <button
                    class="day-button"
                    data-day="FRIDAY"
                    type="button"
                >
                    <span>FRI</span>
                </button>

                <button
                    class="day-button"
                    data-day="SATURDAY"
                    type="button"
                >
                    <span>SAT</span>
                </button>

                <button
                    class="day-button"
                    data-day="SUNDAY"
                    type="button"
                >
                    <span>SUN</span>
                </button>

            </div>


            <button
                class="nav-arrow"
                id="nextDay"
                type="button"
                aria-label="Next day"
            >
                ›
            </button>

        </nav>


        <!-- =========================================
             VIEWING LABEL
        ========================================== -->

        <div
            class="viewing"
            id="viewingLabel"
        >
            TODAY
        </div>


        <!-- =========================================
             TODAY BUTTON
        ========================================== -->

        <button
            class="today-button"
            id="todayButton"
            type="button"
        >
            TODAY
        </button>


        <!-- =========================================
             SCHEDULE
        ========================================== -->

        <section class="schedule">

            <div class="image-wrapper">

                <img
                    id="scheduleImage"
                    src=""
                    alt="Schedule"
                >


                <div class="pointer">

                    <div class="triangle"></div>

                </div>

            </div>

        </section>


    </main>


    <script src="script.js"></script>

</body>

</html>
