<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>Routine</title>

    <link
        rel="stylesheet"
        href="style.css?v=20260823-10"
    >

</head>


<body>


<main class="app">


    <!-- HEADER -->

    <header
        class="header"
        aria-hidden="true"
    >

        <div
            class="day"
            id="dayName"
        ></div>

        <div
            class="time"
            id="currentTime"
        ></div>

    </header>


    <!-- MENU BUTTON -->

    <button
        class="menu-button"
        id="menuButton"
        type="button"
        aria-label="Open menu"
    >

        <span></span>
        <span></span>
        <span></span>

    </button>


    <!-- DAY SWITCHER -->

    <div class="day-navigation">

        <button
            class="nav-button"
            id="prevDay"
            type="button"
            aria-label="Previous day"
        >
            ‹
        </button>


        <button
            class="selected-day"
            id="selectedDayButton"
            type="button"
        >

            <span
                id="selectedDayLabel"
                class="selected-day-label"
            >
                TODAY
            </span>

            <span
                id="selectedDayName"
                class="selected-day-name"
            >
                LOADING
            </span>

        </button>


        <button
            class="nav-button"
            id="nextDay"
            type="button"
            aria-label="Next day"
        >
            ›
        </button>

    </div>


    <!-- SCHEDULE -->

    <section
        class="schedule"
        id="schedule"
    >

        <div
            class="schedule-board"
            id="scheduleBoard"
        >

            <div
                class="empty-state"
                id="emptyState"
            >
                Your schedule is empty
            </div>

        </div>


        <!-- CURRENT TIME POINTER -->

        <div
            class="time-pointer"
            id="timePointer"
            aria-hidden="true"
        >

            <span
                id="pointerSymbol"
            ></span>

        </div>

    </section>


    <!-- BOTTOM DAYS -->

    <nav
        class="bottom-navigation"
        aria-label="Days"
    >

        <div class="days-scroll">


            <button
                class="day-button"
                type="button"
                data-day="MONDAY"
            >
                MON
                <span></span>
            </button>


            <button
                class="day-button"
                type="button"
                data-day="TUESDAY"
            >
                TUE
                <span></span>
            </button>


            <button
                class="day-button"
                type="button"
                data-day="WEDNESDAY"
            >
                WED
                <span></span>
            </button>


            <button
                class="day-button"
                type="button"
                data-day="THURSDAY"
            >
                THU
                <span></span>
            </button>


            <button
                class="day-button"
                type="button"
                data-day="FRIDAY"
            >
                FRI
                <span></span>
            </button>


            <button
                class="day-button"
                type="button"
                data-day="SATURDAY"
            >
                SAT
                <span></span>
            </button>


            <button
                class="day-button"
                type="button"
                data-day="SUNDAY"
            >
                SUN
                <span></span>
            </button>


        </div>

    </nav>


    <!-- MENU OVERLAY -->

    <div
        class="menu-overlay"
        id="menuOverlay"
    ></div>


    <!-- SIDE MENU -->

    <aside
        class="side-menu"
        id="sideMenu"
    >

        <div class="menu-top">

            <button
                class="close-menu"
                id="closeMenu"
                type="button"
                aria-label="Close menu"
            >
                ×
            </button>

        </div>


        <div class="menu-profile">

            <div
                class="menu-avatar"
                id="menuAvatar"
            >
                R
            </div>


            <div>

                <div
                    class="menu-username"
                    id="menuUsername"
                >
                    USER
                </div>


                <div
                    class="menu-email"
                    id="menuEmail"
                >
                    --
                </div>

            </div>

        </div>


        <nav class="menu-links">

            <a
                href="profile.html"
                class="menu-link"
            >
                <span>PROFILE</span>
                <span>›</span>
            </a>


            <a
                href="editor.html"
                class="menu-link"
            >
                <span>EDIT SCHEDULE</span>
                <span>›</span>
            </a>

        </nav>


        <button
            class="logout-button"
            id="logoutButton"
            type="button"
        >
            LOG OUT
        </button>


    </aside>


</main>


<!-- MAIN SCRIPT -->

<script
    type="module"
    src="script.js?v=20260823-10"
></script>


<!-- MENU SCRIPT -->

<script
    type="module"
    src="menu.js?v=20260823-10"
></script>


</body>

</html>
